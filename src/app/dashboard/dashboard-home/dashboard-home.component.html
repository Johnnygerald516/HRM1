<div class="home-container">
  <div class="page-header">
    <h1 class="page-title">Dashboard Overview</h1>
  </div>

  <div class="cards-grid">

    <!-- Total Staff Card -->
    <div class="summary-card card-staff">
      <div class="card-icon-wrapper">
        <i class="bi bi-people-fill card-icon"></i>
      </div>
      <div class="card-body">
        <span class="card-label">Total Staff</span>
        <span class="card-value">{{ totalStaff }}</span>
      </div>
    </div>

    <!-- Total Transfer Card -->
    <div class="summary-card card-transfer">
      <div class="card-icon-wrapper">
        <i class="bi bi-arrow-left-right card-icon"></i>
      </div>
      <div class="card-body">
        <span class="card-label">Total Transfers</span>
        <span class="card-value">{{ totalTransfers }}</span>
      </div>
    </div>

  </div>
</div>
